name: 앱스토어 새 버전 준비 (제출 직전까지)

# ios-apps/prepare.json 을 바꿔서 올리면 실행돼요. 심사 제출 버튼은 누르지 않아요.
# 결과는 ios-apps-logs 브랜치의 prepare.log 에 남아요.
on:
  push:
    branches: [main]
    paths:
      - 'ios-apps/prepare.json'
  workflow_dispatch:

concurrency:
  group: asc-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      ASC_KEY_ID: FSK86ATHXN
      ASC_ISSUER_ID: 22266a72-f903-4eb4-8c12-3dc10d6f28fe
    steps:
      - uses: actions/checkout@v4
      - name: 앱 저장소 받기 (스크린샷)
        run: |
          REPO=$(python3 -c "import json;print(json.load(open('ios-apps/prepare.json'))['repo'])")
          git clone --depth 1 "https://github.com/$REPO.git" app
      - name: 준비하기
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          PREP_LOG: ${{ runner.temp }}/prepare.log
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 ios-apps/asc_prepare.py
      - name: 기록 남기기
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/prepare.log" . 2>/dev/null || echo "기록 없음" > prepare.log
          echo "${{ job.status }} run ${{ github.run_number }} $(date -u)" > prepare-status.txt
          git init -q -b asc-prepare-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "버전 준비 기록 run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" asc-prepare-logs
