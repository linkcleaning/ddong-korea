name: 다른 앱 아이폰 빌드·업로드

# ios-apps/request.json 을 바꿔서 올리면 그 앱을 아이폰용으로 빌드해요.
# (이 저장소에 있는 App Store Connect 키를 같이 쓰려고 여기에 둠)
# 결과는 ios-apps-logs 브랜치에 남아요: status.txt, 화면 사진, 오류 요약
on:
  push:
    branches: [main]
    paths:
      - 'ios-apps/request.json'
      - '.github/workflows/ios-apps.yml'
  workflow_dispatch:

concurrency:
  group: ios-apps
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      ASC_KEY_ID: FSK86ATHXN
      ASC_ISSUER_ID: 22266a72-f903-4eb4-8c12-3dc10d6f28fe
      TEAM_ID: Q9PV582B79
      LOGS: ${{ github.workspace }}/_logs
    steps:
      - uses: actions/checkout@v4

      - name: 요청 읽기
        id: req
        run: |
          mkdir -p "$LOGS"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open('ios-apps/request.json'))
          for k in ['repo', 'ref', 'name', 'name_en', 'bundle', 'project', 'scheme', 'version']:
              print(f"{k}={r[k]}")
          print(f"upload={'1' if r.get('upload') else '0'}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: 앱 코드 받기
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.req.outputs.repo }}
          ref: ${{ steps.req.outputs.ref }}
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 최신 Xcode 고르기
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 웹 파일 만들기 + 앱에 넣기
        working-directory: app
        run: |
          set -o pipefail
          (npm ci || npm install) 2>&1 | tail -n 20
          npm run build 2>&1 | tail -n 20
          npx cap sync ios 2>&1 | tee "$LOGS/cap-sync.log" | tail -n 30

      - name: App Store Connect 확인 (번들 ID 등록·앱 있는지)
        id: asc
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: ${{ steps.req.outputs.bundle }}
          APP_NAME_EN: ${{ steps.req.outputs.name_en }}
          STATUS_FILE: ${{ github.workspace }}/_logs/asc-status.txt
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography requests || python3 -m pip install --quiet pyjwt cryptography requests
          python3 ios-apps/asc_check.py

      - name: 시뮬레이터에서 실행해 보고 화면 찍기
        continue-on-error: true
        working-directory: app
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(rt,x) for rt,l in d.items() if 'iOS' in rt for x in l if 'Pro Max' in x['name']]
          c.sort(key=lambda t:(t[0],t[1]['name']))
          print(c[-1][1]['udid'] if c else '')")
          xcodebuild -project "${{ steps.req.outputs.project }}" -scheme "${{ steps.req.outputs.scheme }}" -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "$LOGS/build-sim.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          APP=$(ls -d build-sim/Build/Products/Debug-iphonesimulator/*.app | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "${{ steps.req.outputs.bundle }}"
          sleep 15
          xcrun simctl io "$UDID" screenshot --type=png "$LOGS/sim-1.png"
          sleep 5
          xcrun simctl io "$UDID" screenshot --type=png "$LOGS/sim-2.png"

      - name: 앱 만들기 (Archive)
        id: archive
        working-directory: app
        run: |
          BUILD_NO=$(( 1000 + ${{ github.run_number }} ))
          echo "build_no=$BUILD_NO" >> "$GITHUB_OUTPUT"
          xcodebuild archive \
            -project "${{ steps.req.outputs.project }}" \
            -scheme "${{ steps.req.outputs.scheme }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ steps.req.outputs.version }}" \
            CURRENT_PROJECT_VERSION=$BUILD_NO \
            > "$LOGS/archive.log" 2>&1 || true
          grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" "$LOGS/archive.log" | sort -u | head -40
          test -d "$RUNNER_TEMP/App.xcarchive"

      - name: App Store Connect에 올리기
        if: steps.req.outputs.upload == '1' && steps.asc.outputs.app_exists == '1'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$LOGS/export.log" 2>&1 || true
          tail -n 40 "$LOGS/export.log"
          rm -f "$KEY"
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|Uploaded" "$LOGS/export.log"

      - name: 결과를 ios-apps-logs 브랜치에 남기기
        if: always()
        run: |
          cd "$LOGS"
          {
            echo "앱: ${{ steps.req.outputs.name }} (${{ steps.req.outputs.bundle }}) 버전 ${{ steps.req.outputs.version }} 빌드 ${{ steps.archive.outputs.build_no }}"
            echo "결과: ${{ job.status }}"
            echo "업로드 요청: ${{ steps.req.outputs.upload }} / 앱 있음: ${{ steps.asc.outputs.app_exists }}"
            echo "실행 번호: ${{ github.run_number }} / 커밋: ${{ github.sha }}"
            date -u
          } > status.txt
          [ -f archive.log ] && { grep -E "error:|warning: .*(sign|deprecated)|ARCHIVE" archive.log | sort -u | head -80 > archive-summary.log; tail -n 120 archive.log > archive-tail.log; rm archive.log; } || true
          [ -f build-sim.log ] && { grep -E "error:|BUILD" build-sim.log | sort -u | head -60 > build-sim-summary.log; rm build-sim.log; } || true
          git init -q -b ios-apps-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "아이폰 빌드 기록 ${{ steps.req.outputs.name }} run ${{ github.run_number }}" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ios-apps-logs
